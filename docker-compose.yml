services:
  mongo:
    image: mongo:8
    container_name: world-sciences-mongo
    ports:
      - "27017:27017"
    volumes:
      - world-sciences-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-seed:
    build:
      context: ./seed
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./seed:/seed:ro
    environment:
      MONGO_HOST: mongo
      MONGO_DB: worldsciences
    restart: "no"

volumes:
  world-sciences-mongo-data:
