services:
  mongo:
    image: mongo:8
    container_name: world-sciences-mongo
    ports:
      - "27017:27017"
    volumes:
      - world-sciences-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  world-sciences-mongo-data:
