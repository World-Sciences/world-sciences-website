name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore backend/WorldSciences.Api.Tests/WorldSciences.Api.Tests.csproj

      - name: Format check
        run: dotnet format backend/WorldSciences.Api.Tests/WorldSciences.Api.Tests.csproj --verify-no-changes --no-restore

      - name: Build
        run: dotnet build backend/WorldSciences.Api.Tests/WorldSciences.Api.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/WorldSciences.Api.Tests/WorldSciences.Api.Tests.csproj --no-build --configuration Release --verbosity normal
